name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar aplicação
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Executar smoke test
        run: node tests/smoke.mjs

      - name: Verificar orçamento de desempenho e PWA
        run: node tests/performance.mjs

      - name: Verificar exportação de segurança
        run: node tests/backup.mjs

      - name: Auditar segurança estática
        run: node tests/security.mjs

      - name: Verificar convite seguro de clientes
        run: node tests/client-invite.mjs

      - name: Confirmar pré-publicação completa
        run: node tests/preflight.mjs

      - name: Verificar sintaxe JavaScript
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets/js -type f -name '*.js' -print0)
          node --check service-worker.js
