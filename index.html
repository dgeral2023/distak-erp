<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DISTAK ERP | Gestão de Obras</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main id="loginScreen" class="login-screen">
    <section class="login-card">
      <div class="brand-row">
        <div class="brand-icon">D</div>
        <div>
          <h1>DISTAK ERP</h1>
          <p>Gestão profissional de obras</p>
        </div>
      </div>
      <h2>Entrar na aplicação</h2>
      <form id="loginForm">
        <label>Email</label>
        <input id="email" type="email" placeholder="Digite o seu email" autocomplete="username" required />
        <label>Palavra-passe</label>
        <input id="password" type="password" placeholder="Digite a sua senha" autocomplete="current-password" required />
        <button type="submit">Entrar</button>
      </form>
      <p id="loginMessage" class="message"></p>
      <small>Perfis: Administrador · Escritório · Encarregado · Funcionário · Cliente</small>
    </section>
  </main>

  <main id="appScreen" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-brand"><div class="brand-icon small">D</div><strong>DISTAK ERP</strong></div>
      <p id="userRole" class="role-badge">perfil</p>
      <nav id="menu"></nav>
      <button id="logoutBtn" class="logout">Sair</button>
    </aside>
    <section class="content">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle">Gestão da DISTAK Construção Civil</p>
        </div>
        <div id="userInfo" class="user-info"></div>
      </header>
      <section id="view" class="view"></section>
    </section>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
