<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DISTAK ERP | Gestão de Obras</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main id="loginScreen" class="login-screen">
    <section class="login-card">
      <div class="brand-row">
        <div class="brand-mark">D</div>
        <div><h1>DISTAK ERP</h1><p>Gestão profissional de obras</p></div>
      </div>
      <h2>Entrar na aplicação</h2>
      <form id="loginForm">
        <label>Email<input id="email" type="email" placeholder="Digite o seu email" autocomplete="username" required /></label>
        <label>Palavra-passe<input id="password" type="password" placeholder="Digite a sua senha" autocomplete="current-password" required /></label>
        <button type="submit">Entrar</button>
      </form>
      <p id="loginMessage" class="message"></p>
      <small>Perfis: Administrador · Escritório · Encarregado · Funcionário · Cliente</small>
    </section>
  </main>

  <main id="appScreen" class="app hidden">
    <aside class="sidebar">
      <div class="logo"><div class="brand-mark small">D</div><strong>DISTAK ERP</strong></div>
      <div id="roleBadge" class="role-badge">—</div>
      <nav id="menu"></nav>
      <button id="logoutBtn" class="logout">Sair</button>
    </aside>
    <section class="content">
      <header class="topbar">
        <div><h1 id="pageTitle">Dashboard</h1><p id="pageSubtitle">Resumo operacional</p></div>
        <div class="user-box"><strong id="userName">Utilizador</strong><span id="userEmail"></span></div>
      </header>
      <section id="view" class="view"></section>
    </section>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
